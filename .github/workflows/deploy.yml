name: Telecom Delinquency CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow python-dotenv pytest httpx

      - name: Download Production Model from MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python src/download_model.py

      - name: Run Unit Tests (The Gatekeeper)
        run: |
          # This command searches for the 'tests' folder and runs any file starting with 'test_'
          pytest tests/ -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provided by GitHub Actions; no need to create it manually
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Docker requires repository names to be strictly lowercase
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_OWNER/telecom-delinquency-api:latest"
          
          echo "Building image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME .
          
          echo "Pushing image to GHCR..."
          docker push $IMAGE_NAME

          # ... [Keep previous steps: Build and Push Docker Image] ...

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Download the newest image from GHCR
            sudo docker pull ghcr.io/ravigupta5/telecom-delinquency-api:latest
            
            # 2. Stop and remove the old container if it exists
            sudo docker stop delinquency-api || true
            sudo docker rm delinquency-api || true
            
            # 3. Start the new container with a specific name AND a mounted volume
            sudo docker run -d --name delinquency-api -p 8000:8000 -v /home/ubuntu/api_logs:/app/logs ghcr.io/ravigupta5/telecom-delinquency-api:latest